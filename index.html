<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Zajac — Portfolio</title>
  <meta name="description" content="Personal portfolio of David Zajac, Computer Science student at Ontario Tech University." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    Content is populated from data.js.
    To update text/projects/education, edit data.js — not this file.
  -->
  <nav>
    <div class="container">
      <div class="brand" id="nav-brand"></div>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#experience">Experience</a></li>
        <li><a href="#education">Education</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>

  <header id="about" class="container hero">
    <img id="hero-photo" alt="Profile photo" />
    <div>
      <h1 id="hero-name"></h1>
      <div class="tagline" id="hero-tagline"></div>
      <p id="hero-intro"></p>
    </div>
  </header>

  <section id="projects">
    <div class="container">
      <h2>Projects</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <section id="experience">
    <div class="container">
      <h2>Experience</h2>
      <div id="experience-list"></div>
    </div>
  </section>

  <section id="education">
    <div class="container">
      <h2>Education</h2>
      <div id="education-list"></div>
    </div>
  </section>

  <section id="skills">
    <div class="container">
      <h2>Skills &amp; Certifications</h2>
      <div class="skills-grid" id="skills-grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="container">
      <h2>Contact</h2>
      <p>Feel free to reach out — I'm always open to interesting conversations.</p>
      <div class="contact-links" id="contact-links"></div>
    </div>
  </section>

  <footer>
    <div class="container">
      <span id="footer-text"></span>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
